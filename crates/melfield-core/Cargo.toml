[package]
name = "melfield-core"
description = "Melfield core: hardware, registry, pulls, engines, audio, storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native-tts", "audio-io"]
# sherpa-onnx native engine (Kokoro, Kitten). Off only for fast unit-test builds.
native-tts = ["dep:sherpa-onnx", "dep:misaki-rs"]
# cpal playback/capture. Off for headless CI test runs without audio devices.
audio-io = ["dep:cpal"]

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
sysinfo = "0.37"
fs2 = "0.4"
hound = "3.5"
flacenc = "0.5"
symphonia = { version = "0.5", default-features = false, features = ["wav", "mp3", "flac", "pcm", "isomp4", "aac", "ogg", "vorbis"] }
rubato = "0.16"
rustfft = "6"
ebur128 = "0.1"
unicode-segmentation = "1"
regex = "1"
minisign-verify = "0.2"
base64 = "0.22"
rand = "0.9"
parking_lot = "0.12"
once_cell = "1"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sherpa-onnx = { version = "=2.0.1", optional = true }
misaki-rs = { version = "=0.8.0", default-features = false, optional = true }
cpal = { version = "0.18", optional = true }
keyring = "4"

[target.'cfg(not(target_os = "macos"))'.dependencies]
nvml-wrapper = "0.11"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
axum = "0.8"
